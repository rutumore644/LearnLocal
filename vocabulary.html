<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnLocal | Vocabulary</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <a class="logo" href="index.html">
        Learn<span>Local</span>
    </a>

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="lessons.html">
            Lessons
        </a>

        <a class="active" href="vocabulary.html">
            Vocabulary
        </a>

        <a href="translator.html">
            Translate
        </a>

        <a href="quiz.html">
            Quiz
        </a>

        <a href="progress.html">
            Progress
        </a>

        <a href="feedback.html">
            Feedback
        </a>

    </nav>

</header>


<main class="page">

    <div class="page-heading">

        <p class="eyebrow">
            PRACTICE
        </p>

        <h1>
            Vocabulary
        </h1>

        <p>
            Learn useful words with their translation,
            pronunciation and meaning.
        </p>

    </div>


    <div class="toolbar">

        <div>

            <label for="vocabularyLanguage">
                Learning Language
            </label>

            <select id="vocabularyLanguage">

                <option value="Marathi">
                    Marathi
                </option>

                <option value="Hindi">
                    Hindi
                </option>

                <option value="French">
                    French
                </option>

                <option value="Korean">
                    Korean
                </option>

            </select>

        </div>


        <div>

            <label for="vocabularySearch">
                Search Word
            </label>

            <input
                type="text"
                id="vocabularySearch"
                placeholder="Search vocabulary...">

        </div>

    </div>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        English
                    </th>

                    <th>
                        Translation
                    </th>

                    <th>
                        Pronunciation
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Meaning
                    </th>

                </tr>

            </thead>


            <tbody id="vocabularyBody">

            </tbody>

        </table>

    </div>

</main>


<footer class="site-footer">

    <p>
        LearnLocal • Educational Language Learning Project
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
